services:
  postgres:
    image: postgres:16-alpine
    container_name: ruang-idb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruang_idb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ruang_idb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruang_idb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ruang_idb_pgdata:
